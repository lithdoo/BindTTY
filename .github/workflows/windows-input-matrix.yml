name: Windows Input Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-physical-fixtures:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and compile native input
        run: npm ci

      - name: Validate required PowerShell and host matrix
        run: npm run validate:windows-matrix --workspace @bindtty/e2e

      - name: Run Windows input stack and ConPTY E2E
        run: |
          npm test --workspace @bindtty/win32-input
          npm test --workspace @bindtty/input
          npm test --workspace @bindtty/terminal
          npm run test:e2e:real:win
